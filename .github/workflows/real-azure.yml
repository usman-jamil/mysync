name: Real Azure tests

# The storage and end-to-end suites against a real Azure Storage account instead of Azurite, for
# what only real Azure can prove: throughput, real auth failures, and large shares (CLAUDE.md §14).
# Manual only, and it does nothing until the secret exists.
#
# Setup, once:
#   1. Create a storage account used for nothing else (tests create and delete containers named t-*).
#   2. Add a repository secret MYSYNC_REAL_AZURE_CONNECTION_STRING with its *account key* connection
#      string (a SAS-only one can't run the wrong-key test).
#   3. Optional, for the publishing tests: a second test-only account with static website hosting on
#      (index document index.html). Add MYSYNC_REAL_AZURE_PUBLISH_CONNECTION_STRING (its account-key
#      connection string) and MYSYNC_REAL_AZURE_PUBLISH_BASE_URL (its static website URL, e.g.
#      https://<account>.z13.web.core.windows.net). With both, the run also checks that a published
#      file with Content-Encoding: gzip is served with that header and that a plain client, a browser-like
#      one, curl --compressed and PowerShell all end up with the original bytes (compressed shares).
#   4. Actions → Real Azure tests → Run workflow.

on:
  workflow_dispatch:
    inputs:
      large:
        description: 'Also run the large-share tests (a 300 MB file, a 5,000-file share)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: real-azure
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 'true'

jobs:
  real-azure:
    name: Storage + end-to-end tests on real Azure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check the secret is configured
        env:
          CONNECTION_STRING: ${{ secrets.MYSYNC_REAL_AZURE_CONNECTION_STRING }}
        run: |
          if [ -z "$CONNECTION_STRING" ]; then
            echo "::error::Add the repository secret MYSYNC_REAL_AZURE_CONNECTION_STRING (an account-key connection string for a test-only storage account). See the top of this workflow."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build mysync.slnx --configuration Release

      # The suites take supplied storage from MYSYNC_TEST_AZURITE_CONNECTION_STRING instead of starting
      # Azurite, give every container this run's prefix, and delete them at the end. GitHub masks the
      # secret in the log; the tests themselves never print a connection string.
      - name: Storage integration + end-to-end tests
        env:
          MYSYNC_TEST_AZURITE_CONNECTION_STRING: ${{ secrets.MYSYNC_REAL_AZURE_CONNECTION_STRING }}
          # Optional: a second, test-only account with static website hosting on (index.html), for the
          # publishing tests; without it they skip. Their publications are deleted at the end of the run.
          MYSYNC_TEST_PUBLISH_CONNECTION_STRING: ${{ secrets.MYSYNC_REAL_AZURE_PUBLISH_CONNECTION_STRING }}
          # Optional, with the above: that account's static website URL, for the Content-Encoding check.
          MYSYNC_TEST_PUBLISH_BASE_URL: ${{ secrets.MYSYNC_REAL_AZURE_PUBLISH_BASE_URL }}
          MYSYNC_TEST_LARGE: ${{ inputs.large && '1' || '' }}
        run: |
          set -euo pipefail
          dotnet test --project tests/mysync/storage-azure-integration-tests/MySync.Storage.Azure.IntegrationTests.csproj --configuration Release --no-build
          dotnet test --project tests/mysync/end-to-end-tests/MySync.EndToEndTests.csproj --configuration Release --no-build

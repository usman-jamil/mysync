name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 'true'

jobs:
  # apps/mysync-site: checked and built once, before any .NET build. Every .NET job downloads the
  # build, because MySync.SiteAssets embeds it into the CLI (CLAUDE.md, Publishing).
  site:
    name: Site (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, typecheck, test and build
        run: npx nx run-many -t lint,typecheck,test,build -p mysync-site

      - name: Upload the site build
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist/apps/mysync-site
          if-no-files-found: error
          retention-days: 7

  build-and-unit-test:
    name: Build + unit tests (${{ matrix.os }})
    needs: site
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # The site build from the `site` job: the CLI embeds it, and a Release build fails without it.
      - name: Download the site build
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist/apps/mysync-site

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore mysync.slnx

      - name: Build
        run: dotnet build mysync.slnx --configuration Release --no-restore

      # install.ps1's signature check: Windows PowerShell 5.1 takes a .NET Framework (CNG) path that
      # only a Windows machine can run; PowerShell 7 takes the other one.
      - name: install.ps1 signature check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/install-ps1-check.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/release/install-ps1-check.ps1

      # Path rules and local-disk behaviour differ per OS, so unit tests run on all three.
      - name: Unit + architecture tests
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            tests/mysync/domain-unit-tests/MySync.Domain.UnitTests.csproj \
            tests/mysync/application-unit-tests/MySync.Application.UnitTests.csproj \
            tests/mysync/infrastructure-unit-tests/MySync.Infrastructure.UnitTests.csproj \
            tests/mysync/site-assets-unit-tests/MySync.SiteAssets.UnitTests.csproj \
            tests/mysync/storage-s3-unit-tests/MySync.Storage.S3.UnitTests.csproj \
            tests/mysync/tui-unit-tests/MySync.Tui.UnitTests.csproj \
            tests/mysync/architecture-tests/MySync.ArchitectureTests.csproj
          do
            dotnet test --project "$project" --configuration Release --no-build
          done

  # `mysync update` with real published binaries: an old build updates itself from a signed local
  # release, and refuses a tampered archive and a wrongly signed one (tools/release/update-e2e.sh).
  # Windows' rename-aside swap is covered by ExecutableInstallerTests on the Windows runner.
  self-update:
    name: Self-update end to end (${{ matrix.rid }})
    needs: site
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v5

      # The site build from the `site` job: the CLI embeds it, and a Release build fails without it.
      - name: Download the site build
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist/apps/mysync-site

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Update an old build to a new one
        env:
          RID: ${{ matrix.rid }}
        run: tools/release/update-e2e.sh "$RID"

  # The storage and end-to-end suites against REAL storage: a test-only Azure account and a
  # test-only S3 bucket (there is no emulator; CLAUDE.md §14). MYSYNC_TEST_REQUIRE_STORAGE makes a
  # missing secret fail the run instead of skipping the tests. Pull requests from forks get no
  # secrets, so this job doesn't run for them. Setup: docs/ci-storage.md.
  real-storage:
    name: Storage + end-to-end tests (real Azure and S3)
    needs: site
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time against the shared test storage: the clean-up of publications is by time.
    concurrency:
      group: real-storage
      cancel-in-progress: false
    env:
      MYSYNC_TEST_REQUIRE_STORAGE: '1'
      MYSYNC_TEST_AZURE_CONNECTION_STRING: ${{ secrets.MYSYNC_REAL_AZURE_CONNECTION_STRING }}
      MYSYNC_TEST_AZURE_PUBLISH_CONNECTION_STRING: ${{ secrets.MYSYNC_REAL_AZURE_PUBLISH_CONNECTION_STRING }}
      MYSYNC_TEST_AZURE_PUBLISH_BASE_URL: ${{ secrets.MYSYNC_REAL_AZURE_PUBLISH_BASE_URL }}
      MYSYNC_TEST_S3_BUCKET: ${{ secrets.MYSYNC_REAL_S3_BUCKET }}
      MYSYNC_TEST_S3_REGION: ${{ secrets.MYSYNC_REAL_S3_REGION }}
      MYSYNC_TEST_S3_PUBLISH_BUCKET: ${{ secrets.MYSYNC_REAL_S3_PUBLISH_BUCKET }}
      MYSYNC_TEST_S3_PUBLISH_BASE_URL: ${{ secrets.MYSYNC_REAL_S3_PUBLISH_BASE_URL }}
      # The test IAM user (exactly the permissions of docs/aws.md), through the standard AWS chain.
      AWS_ACCESS_KEY_ID: ${{ secrets.MYSYNC_REAL_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MYSYNC_REAL_AWS_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Check the secrets are configured
        run: tools/ci/check-storage-secrets.sh

      # The site build from the `site` job: the CLI embeds it, and a Release build fails without it.
      - name: Download the site build
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist/apps/mysync-site

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build mysync.slnx --configuration Release

      # GitHub masks the secrets in the log; the tests never print a connection string or key.
      - name: Storage integration + end-to-end tests
        run: |
          set -euo pipefail
          dotnet test --project tests/mysync/storage-azure-integration-tests/MySync.Storage.Azure.IntegrationTests.csproj --configuration Release --no-build
          dotnet test --project tests/mysync/storage-s3-integration-tests/MySync.Storage.S3.IntegrationTests.csproj --configuration Release --no-build
          dotnet test --project tests/mysync/end-to-end-tests/MySync.EndToEndTests.csproj --configuration Release --no-build

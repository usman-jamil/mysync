name: Release mysync

# Publishes the mysync CLI (apps/mysync) for every supported platform (CLAUDE.md §16).
#
# Tagging `mysync-1.2.3` (or `mysync-v1.2.3-beta.1`) builds the binaries and creates the GitHub
# release. `workflow_dispatch` runs the same build and leaves the archives as workflow artifacts
# without publishing anything, so a release can be rehearsed before it is tagged.

on:
  push:
    tags:
      - 'mysync-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.2.3 or 1.2.3-beta.1. Dry run — no release is published.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-mysync-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 'true'
  PROJECT: apps/mysync/MySync.Cli.csproj

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Resolve the version from the tag or the dispatch input
        id: resolve
        env:
          # Through the environment rather than inline `${{ }}`: a tag name is attacker-supplied
          # text and must never be pasted into a shell script.
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          raw="$RAW_VERSION"
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            raw="${raw#mysync-}"
          fi
          version="${raw#v}"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid version. Tag as mysync-1.2.3 or mysync-v1.2.3-beta.1."
            exit 1
          fi

          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "mysync $version (prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  # apps/mysync-site, checked and built once; every binary embeds this same build.
  site:
    name: Site
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, typecheck, test and build
        run: npx nx run-many -t lint,typecheck,test,build -p mysync-site

      # Not "mysync-*": the release job merges every mysync-* artifact into the release's files.
      - name: Upload the site build
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist/apps/mysync-site
          if-no-files-found: error

  test:
    name: Test
    needs: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The site build from the `site` job, embedded into the binary (a Release build fails without it).
      - name: Download the site build
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist/apps/mysync-site

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build mysync.slnx --configuration Release

      # The Azurite image (pinned in tests/mysync/testing/AzuriteImage.cs) comes from the cache
      # rather than MCR on every run.
      - name: Find the pinned Azurite image
        id: azurite
        run: echo "image=$(grep -oE 'mcr\.microsoft\.com/azure-storage/azurite:[^"]+' tests/mysync/testing/AzuriteImage.cs)" >> "$GITHUB_OUTPUT"

      - name: Cache the Azurite image
        id: azurite-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/azurite-image.tar
          key: azurite-image-${{ steps.azurite.outputs.image }}

      - name: Load the Azurite image
        env:
          IMAGE: ${{ steps.azurite.outputs.image }}
          CACHED: ${{ steps.azurite-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$CACHED" = "true" ]; then
            docker load --input ~/.cache/azurite-image.tar
          else
            docker pull "$IMAGE"
            mkdir -p ~/.cache
            docker save "$IMAGE" --output ~/.cache/azurite-image.tar
          fi

      - name: Test everything (Azurite suites included; Docker is available here)
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: dotnet test --solution mysync.slnx --configuration Release --no-build

  # Who releases: this repository, and the public half of its MYSYNC_RELEASE_SIGNING_KEY. Every
  # binary is built to update from here and to trust only this key, so a fork that adds its own
  # secret releases its own mysync with no code change (CLAUDE.md §16). This job only checks the
  # key, before anything is built; each job that needs the public key derives it itself
  # (tools/release/public-key.sh), because a job output carrying it can be masked empty.
  identity:
    name: Release identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/release

      - name: Check the signing key
        env:
          SIGNING_KEY: ${{ secrets.MYSYNC_RELEASE_SIGNING_KEY }}
          REPOSITORY: ${{ github.repository }}
          UPSTREAM: usman-jamil/mysync
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The repository secret MYSYNC_RELEASE_SIGNING_KEY is missing. Create one with 'openssl ecparam -name prime256v1 -genkey -noout -out mysync-release-signing.key.pem' and add the file's contents as that secret."
            exit 1
          fi

          public_key="$(tools/release/public-key.sh)" || { echo "::error::MYSYNC_RELEASE_SIGNING_KEY must be a PEM P-256 private key."; exit 1; }

          # Upstream binaries built locally trust the committed key too, so upstream must sign with it.
          committed="$(grep -v -- ----- tools/release/mysync-release-signing.pub.pem | tr -d '\n')"
          if [ "$REPOSITORY" = "$UPSTREAM" ] && [ "$public_key" != "$committed" ]; then
            echo "::error::MYSYNC_RELEASE_SIGNING_KEY doesn't match tools/release/mysync-release-signing.pub.pem."
            exit 1
          fi

  build:
    name: Build ${{ matrix.rid }}
    needs: [version, site, test, identity]
    # Every target is cross-published from Linux. A self-contained (non-AOT) publish does not
    # need a matching host, and building the Unix targets on a Unix host is what preserves the
    # executable bit inside the archives — a Windows runner would drop it.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: linux-musl-x64
            archive: tar.gz
          - rid: osx-x64
            archive: tar.gz
          - rid: osx-arm64
            archive: tar.gz
          - rid: win-x64
            archive: zip
          - rid: win-arm64
            archive: zip
    steps:
      - uses: actions/checkout@v5

      # The site build from the `site` job, embedded into the binary (a Release build fails without it).
      - name: Download the site build
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist/apps/mysync-site

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Mirrored by the Nx `publish` target in apps/mysync/project.json — keep them in sync.
      # Not trimmed: the configuration binder and Serilog resolve types by reflection.
      - name: Publish
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          SIGNING_KEY: ${{ secrets.MYSYNC_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail

          # Derived here, never empty: a binary built without it would silently trust the built-in key.
          RELEASE_PUBLIC_KEY="$(tools/release/public-key.sh)"

          dotnet publish "$PROJECT" \
            --configuration Release \
            --runtime "$RID" \
            --self-contained true \
            --output "publish/$RID" \
            -p:Version="$VERSION" \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:InvariantGlobalization=true \
            -p:DebugType=embedded \
            -p:MySyncReleaseRepository="$RELEASE_REPOSITORY" \
            -p:MySyncReleasePublicKey="$RELEASE_PUBLIC_KEY"

      # Proves the self-containment claim on stock images: the tagged version is reported,
      # Unicode normalization works inside the shipped binary (CLAUDE.md §8), and the real
      # publication page is embedded (`debug site-assets` fails on the Debug placeholder).
      - name: Smoke test in a stock container
        if: matrix.rid == 'linux-x64' || matrix.rid == 'linux-musl-x64'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail

          if [ "$RID" = "linux-musl-x64" ]; then
            image=alpine:3.22
            # Self-contained .NET on musl still needs the C++ runtime from the distro.
            prepare='apk add --no-cache libstdc++ libgcc >/dev/null'
          else
            image=ubuntu:24.04
            prepare='true'
          fi

          docker run --rm --volume "$PWD/publish/$RID:/opt/mysync:ro" "$image" sh -c "
            set -e
            $prepare
            reported=\$(/opt/mysync/mysync --version)
            if [ \"\$reported\" != \"$VERSION\" ]; then
              echo \"Published binary reported version '\$reported', expected '$VERSION'.\" >&2
              exit 1
            fi
            /opt/mysync/mysync self-check
            /opt/mysync/mysync debug site-assets
          "

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail

          # Not dist/: the site build lives in dist/apps, and everything in this folder becomes a release file.
          mkdir -p packages
          name="mysync-$VERSION-$RID"

          if [ "$ARCHIVE" = "zip" ]; then
            (cd "publish/$RID" && zip --quiet --recurse-paths "$GITHUB_WORKSPACE/packages/$name.zip" .)
          else
            tar --create --gzip --file "packages/$name.tar.gz" --directory "publish/$RID" .
          fi

          (cd packages && sha256sum "$name.$ARCHIVE" > "$name.$ARCHIVE.sha256")
          ls -l packages

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: mysync-${{ matrix.rid }}
          path: packages/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [version, identity, build]
    # Tags publish; a manual run only leaves the archives as workflow artifacts.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every archive
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: mysync-*
          merge-multiple: true

      - name: Collect the checksums into one file
        run: |
          set -euo pipefail

          cd artifacts
          cat ./*.sha256 | sort -k 2 > SHA256SUMS.txt
          rm -f ./*.sha256
          cat SHA256SUMS.txt

      - uses: actions/checkout@v5
        with:
          path: source
          sparse-checkout: tools/release

      # `mysync update` installs nothing that isn't signed with this key (ECDSA P-256, SHA-256, DER),
      # and the key's public half was built into every binary.
      - name: Sign the checksums
        env:
          SIGNING_KEY: ${{ secrets.MYSYNC_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The repository secret MYSYNC_RELEASE_SIGNING_KEY is missing. Releases must be signed, or 'mysync update' can't install them."
            exit 1
          fi

          key="$RUNNER_TEMP/signing.key.pem"
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$key"
          openssl dgst -sha256 -sign "$key" -out artifacts/SHA256SUMS.txt.sig artifacts/SHA256SUMS.txt
          rm -f "$key"

          RELEASE_PUBLIC_KEY="$(source/tools/release/public-key.sh)"

          # The signature must verify with the public key the binaries trust, or no one could update.
          # The key goes out with the release, for people who verify by hand.
          { echo '-----BEGIN PUBLIC KEY-----'; printf '%s\n' "$RELEASE_PUBLIC_KEY" | fold -w 64; echo '-----END PUBLIC KEY-----'; } \
            > artifacts/mysync-release-signing.pub.pem
          openssl dgst -sha256 -verify artifacts/mysync-release-signing.pub.pem \
            -signature artifacts/SHA256SUMS.txt.sig artifacts/SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<'NOTES'
          `mysync` syncs folders between machines through an Azure Blob Storage container, with no
          server of its own. These are self-contained builds: no .NET runtime or SDK is needed.
          Full guide: [README](https://github.com/REPOSITORY/blob/TAG/README.md).

          | Platform | Download |
          | --- | --- |
          | macOS (Apple silicon) | `mysync-VERSION-osx-arm64.tar.gz` |
          | macOS (Intel) | `mysync-VERSION-osx-x64.tar.gz` |
          | Linux (x64, glibc) | `mysync-VERSION-linux-x64.tar.gz` |
          | Linux (arm64, glibc) | `mysync-VERSION-linux-arm64.tar.gz` |
          | Linux (x64, musl / Alpine) | `mysync-VERSION-linux-musl-x64.tar.gz` |
          | Windows (x64) | `mysync-VERSION-win-x64.zip` |
          | Windows (arm64) | `mysync-VERSION-win-arm64.zip` |

          ### Install

          ```bash
          curl -fsSL https://raw.githubusercontent.com/REPOSITORY/main/install.sh | sh                # macOS, Linux
          ```

          ```powershell
          irm https://raw.githubusercontent.com/REPOSITORY/main/install.ps1 | iex                     # Windows
          ```

          Already installed? `mysync update`. Both check the release signature before installing anything.

          ### Install by hand — macOS and Linux

          ```bash
          tar -xzf mysync-VERSION-<platform>.tar.gz
          sudo mv mysync /usr/local/bin/mysync
          mysync --version
          ```

          The binary is unsigned, so macOS quarantines it. Clear that once with
          `xattr -d com.apple.quarantine /usr/local/bin/mysync`. On Alpine, install the C++ runtime
          first: `apk add libstdc++ libgcc`.

          ### Install by hand — Windows

          Unzip and put `mysync.exe` in a folder on your `PATH`. SmartScreen warns about unsigned
          executables the first time; choose *More info* → *Run anyway*. For paths longer than 260
          characters, enable long-path support in Windows.

          ### Verify the download

          ```bash
          sha256sum -c --ignore-missing SHA256SUMS.txt          # Linux
          shasum -a 256 -c --ignore-missing SHA256SUMS.txt      # macOS
          # and that SHA256SUMS.txt is the one the mysync release key signed:
          openssl dgst -sha256 -verify mysync-release-signing.pub.pem -signature SHA256SUMS.txt.sig SHA256SUMS.txt
          ```

          `mysync-release-signing.pub.pem` is attached to this release; check it against a copy you
          already trust (for the upstream project, [`tools/release/mysync-release-signing.pub.pem`](https://github.com/REPOSITORY/blob/TAG/tools/release/mysync-release-signing.pub.pem)).
          Already have mysync? `mysync update` does all of this itself.

          On Windows: `(Get-FileHash mysync-VERSION-win-x64.zip).Hash` and compare with `SHA256SUMS.txt`.

          ### Quick start

          ```bash
          export AZURE_STORAGE_CONNECTION_STRING="<connection string>"   # never typed into a prompt
          export MYSYNC_CONTAINER=mysync                                  # optional

          cd ~/projects/report && mysync sync --name q3-report   # creates a share called q3-report
          cd ~/elsewhere/report && mysync sync q3-report         # on another machine, in an empty folder: clone it
          mysync sync                                            # from then on, in either folder: two-way sync
          ```

          `mysync status` shows what a sync would do, `mysync conflicts` lists what both sides changed,
          `mysync diff` shows what differs (a patch, with the resolve commands to paste),
          `mysync resolve <path> --keep local|remote` decides one, `mysync info` describes the share,
          `mysync shares` lists every named share, `mysync rename <name>` renames this one,
          `mysync gc` removes stored files no recent revision uses, and `mysync delete --yes` removes a share
          for every machine (local files stay). Every command takes `--json`.
          NOTES

          sed -i -e "s/VERSION/$VERSION/g" -e "s|REPOSITORY|$GITHUB_REPOSITORY|g" -e "s|/TAG/|/$TAG/|g" "$notes"

          generated=$(gh api \
            --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            --field tag_name="$TAG" \
            --jq '.body' || true)

          if [ -n "$generated" ]; then
            printf '\n---\n\n%s\n' "$generated" >> "$notes"
          fi

          prerelease_flag=""
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          # A failed earlier run can leave a draft for this tag; start again from nothing.
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)" = "true" ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

          # Only files: a folder here means another artifact matched the download pattern.
          for file in artifacts/*; do
            [ -f "$file" ] || { echo "::error::$file is not a file; only the archives and checksums belong in the release."; exit 1; }
          done

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "mysync $VERSION" \
            --notes-file "$notes" \
            $prerelease_flag \
            artifacts/*
